name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build all platforms (version from tag)
        run: make dist VERSION=${{ github.ref_name }}

      - name: Checksums
        run: |
          cd dist
          sha256sum pism-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: pism ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/pism-*
            dist/SHA256SUMS.txt
